<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>你的大脑情绪负荷有多高？</title>
  <meta name="description" content="12题情绪状态自测，帮你识别当前情绪耗能层级，并提供专业引导。">
  <style>
    :root {
      --bg: #f8f6f3;
      --card: #ffffff;
      --text: #2c2c2c;
      --text-light: #6b6b6b;
      --primary: #5e7a64;
      --primary-light: #eaf0ec;
      --accent: #c78d6b;
      --accent-light: #f6ece4;
      --danger: #b95c5c;
      --danger-light: #f8e8e8;
      --warning: #d4a35a;
      --warning-light: #faf2e3;
      --info: #5a7fa8;
      --info-light: #e8eff7;
      --radius: 20px;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 14px 40px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--bg);
    }

    .page {
      position: absolute;
      inset: 0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #page-result.active {
      position: relative;
      height: auto;
      min-height: 100vh;
      justify-content: flex-start;
      padding-top: 24px;
      padding-bottom: 40px;
      overflow: visible;
    }

    #page-result {
      position: absolute;
      overflow-y: auto;
    }

    /* Intro */
    .intro-brain {
      width: 100%;
      max-width: 320px;
      margin: 0 auto 24px;
      position: relative;
      aspect-ratio: 1;
    }

    .brain-circle {
      position: absolute;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
    }

    .brain-circle.top {
      width: 56%;
      height: 56%;
      background: var(--primary-light);
      color: var(--primary);
      top: 8%;
      left: 22%;
      z-index: 2;
    }

    .brain-circle.left {
      width: 44%;
      height: 44%;
      background: var(--accent-light);
      color: var(--accent);
      bottom: 8%;
      left: 6%;
      z-index: 1;
    }

    .brain-circle.right {
      width: 44%;
      height: 44%;
      background: var(--info-light);
      color: var(--info);
      bottom: 8%;
      right: 6%;
      z-index: 1;
    }

    .brain-circle span:first-child { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
    .brain-circle span:last-child { font-size: 18px; }

    .brain-circle.top span:first-child { font-size: 13px; }
    .brain-circle.top span:last-child { font-size: 24px; }

    .title {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-light);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 18px rgba(94, 122, 100, 0.3);
    }

    .btn-primary:active { transform: scale(0.98); box-shadow: 0 3px 10px rgba(94, 122, 100, 0.25); }

    .btn-outline {
      background: white;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      margin-top: 12px;
    }

    .btn-accent { background: var(--accent); color: white; box-shadow: 0 6px 18px rgba(199, 141, 107, 0.3); }
    .btn-danger { background: var(--danger); color: white; box-shadow: 0 6px 18px rgba(185, 92, 92, 0.3); }
    .btn-warning { background: var(--warning); color: white; box-shadow: 0 6px 18px rgba(212, 163, 90, 0.3); }
    .btn-info { background: var(--info); color: white; box-shadow: 0 6px 18px rgba(90, 127, 168, 0.3); }

    .tagline {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-light);
    }

    .tagline span {
      background: white;
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* Quiz */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.06);
      border-radius: 3px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .quiz-step {
      font-size: 13px;
      color: var(--text-light);
      font-weight: 600;
    }

    .quiz-category {
      font-size: 12px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .question {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 28px;
      min-height: 64px;
    }

    .option {
      background: var(--card);
      border: 1.5px solid transparent;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .option:hover { border-color: var(--primary); transform: translateY(-2px); }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .option-text { font-size: 15px; line-height: 1.5; color: var(--text); }

    /* Loading */
    .loading-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      position: relative;
    }

    .loading-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--primary);
      animation: spin 1s linear infinite;
    }

    .loading-ring:nth-child(2) {
      inset: 10px;
      border-top-color: var(--accent);
      animation: spin 1.4s linear infinite reverse;
    }

    .loading-ring:nth-child(3) {
      inset: 20px;
      border-top-color: var(--info);
      animation: spin 1.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .loading-sub {
      text-align: center;
      font-size: 14px;
      color: var(--text-light);
    }

    /* Result */
    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 20px;
    }

    .result-type {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 15px;
      color: var(--text-light);
      line-height: 1.7;
    }

    .score-bar {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.06);
      border-radius: 6px;
      margin: 24px 0 8px;
      overflow: hidden;
      position: relative;
    }

    .score-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .score-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-light);
    }

    .radar-wrap {
      width: 100%;
      max-width: 260px;
      margin: 20px auto;
      aspect-ratio: 1;
      position: relative;
    }

    .radar-svg { width: 100%; height: 100%; }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 24px 0 12px;
    }

    .tip-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .tip-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .tip-content h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .tip-content p { font-size: 14px; color: var(--text-light); line-height: 1.6; }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .action-card .emoji { font-size: 28px; margin-bottom: 8px; }
    .action-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .action-card p { font-size: 12px; color: var(--text-light); }

    .disclaimer {
      font-size: 12px;
      color: #999;
      line-height: 1.7;
      text-align: center;
      margin-top: 20px;
      padding: 0 8px;
    }

    .hotline {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-top: 12px;
    }

    .hotline-title { font-size: 14px; font-weight: 700; color: var(--danger); margin-bottom: 6px; }
    .hotline-number { font-size: 20px; font-weight: 800; color: var(--danger); letter-spacing: 1px; }
    .hotline-desc { font-size: 12px; color: var(--text-light); margin-top: 4px; }

    .result-actions { margin-top: 8px; }

    .result-actions .btn { margin-bottom: 10px; }

    /* Utilities */
    .hidden { display: none; }
    .fade-in { animation: fadeIn 0.6s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Type colors */
    .type-stable .result-type, .type-stable .result-title { color: var(--primary); }
    .type-stable .score-fill { background: linear-gradient(90deg, var(--primary), #7fa386); }
    .type-stable .tip-icon { background: var(--primary-light); }

    .type-tired .result-type, .type-tired .result-title { color: var(--accent); }
    .type-tired .score-fill { background: linear-gradient(90deg, var(--accent), #e0a97e); }
    .type-tired .tip-icon { background: var(--accent-light); }

    .type-burnout .result-type, .type-burnout .result-title { color: var(--warning); }
    .type-burnout .score-fill { background: linear-gradient(90deg, #d4a35a, #e8c07d); }
    .type-burnout .tip-icon { background: var(--warning-light); }

    .type-support .result-type, .type-support .result-title { color: var(--danger); }
    .type-support .score-fill { background: linear-gradient(90deg, var(--danger), #d47a7a); }
    .type-support .tip-icon { background: var(--danger-light); }

    .type-support .hotline { border: 1px solid var(--danger-light); }
  </style>
</head>
<body>
<div class="app">

  <!-- 开场页 -->
  <div class="page active" id="page-intro">
    <div class="intro-brain">
      <div class="brain-circle top">
        <span>前额叶</span>
        <span>理性判断</span>
      </div>
      <div class="brain-circle left">
        <span>杏仁核</span>
        <span>情绪反应</span>
      </div>
      <div class="brain-circle right">
        <span>海马体</span>
        <span>记忆专注</span>
      </div>
    </div>

    <h1 class="title">你的大脑<br>情绪负荷有多高？</h1>
    <p class="subtitle">
      12 道题，从情绪反应、精力睡眠、认知注意力、社交与自我评价 4 个维度，
      识别你当前的情绪耗能状态，并给出下一步引导。
    </p>

    <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>

    <div class="tagline">
      <span>12 题</span>
      <span>4 个维度</span>
      <span>1 份引导</span>
    </div>
  </div>

  <!-- 答题页 -->
  <div class="page" id="page-quiz">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <div class="quiz-header">
      <span class="quiz-step" id="quiz-step">01 / 12</span>
      <span class="quiz-category" id="quiz-category">情绪反应</span>
    </div>
    <div class="question" id="question-text"></div>
    <div id="options-container"></div>
  </div>

  <!-- 加载页 -->
  <div class="page" id="page-loading">
    <div class="loading-icon">
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
    </div>
    <div class="loading-text" id="loading-text">正在分析你的情绪脑区状态…</div>
    <div class="loading-sub">前额叶 · 杏仁核 · 海马体 · 神经递质</div>
  </div>

  <!-- 结果页 -->
  <div class="page" id="page-result">
    <div id="result-container"></div>
  </div>

</div>

<script>
const questions = [
  { category: "情绪反应", text: "最近一周，你的情绪波动频率是？", options: [
    { label: "A", text: "基本平稳，很少有大的起伏", score: 0 },
    { label: "B", text: "偶尔会有低落或烦躁，但能自己恢复", score: 1 },
    { label: "C", text: "经常莫名情绪低落，恢复很慢", score: 2 },
    { label: "D", text: "几乎每天都难过，很难开心起来", score: 3 }
  ]},
  { category: "情绪反应", text: "遇到一件不顺心的小事，你的反应是？", options: [
    { label: "A", text: "当时有点烦，但很快就过去了", score: 0 },
    { label: "B", text: "会难受一两个小时，然后能转移注意力", score: 1 },
    { label: "C", text: "会反复想这件事，影响半天心情", score: 2 },
    { label: "D", text: "觉得'完了'，小事也被放大成'我很失败'", score: 3 }
  ]},
  { category: "情绪反应", text: "你最近一次发自内心开心是什么时候？", options: [
    { label: "A", text: "就在最近一两天", score: 0 },
    { label: "B", text: "上周有过，但不多", score: 1 },
    { label: "C", text: "想不起来具体的开心时刻", score: 2 },
    { label: "D", text: "已经很久没有开心过了", score: 3 }
  ]},
  { category: "精力睡眠", text: "你的身体疲惫感是？", options: [
    { label: "A", text: "累了睡一觉就能恢复", score: 0 },
    { label: "B", text: "最近容易累，但休息后有改善", score: 1 },
    { label: "C", text: "持续疲惫，休息也缓解不了", score: 2 },
    { label: "D", text: "累到极点，但脑子停不下来，睡不好", score: 3 }
  ]},
  { category: "精力睡眠", text: "你的睡眠状态是？", options: [
    { label: "A", text: "入睡正常，睡眠质量不错", score: 0 },
    { label: "B", text: "偶尔失眠或睡不够", score: 1 },
    { label: "C", text: "经常入睡困难、早醒或多梦", score: 2 },
    { label: "D", text: "几乎每天睡不好，白天昏昏沉沉", score: 3 }
  ]},
  { category: "精力睡眠", text: "你白天的精力和动力是？", options: [
    { label: "A", text: "动力充足，能专注做事", score: 0 },
    { label: "B", text: "偶尔犯懒，但启动后还能继续", score: 1 },
    { label: "C", text: "启动困难，很多事拖到最后一刻", score: 2 },
    { label: "D", text: "完全没有动力，连起床、洗漱都觉得费力", score: 3 }
  ]},
  { category: "认知注意", text: "你最近的注意力状态是？", options: [
    { label: "A", text: "能专注当下，不容易分心", score: 0 },
    { label: "B", text: "偶尔走神，但能拉回来", score: 1 },
    { label: "C", text: "经常脑子转不动，做简单决定都难", score: 2 },
    { label: "D", text: "注意力涣散，看书/工作都集中不了几分钟", score: 3 }
  ]},
  { category: "认知注意", text: "你的记忆力或做事效率是？", options: [
    { label: "A", text: "记忆力正常，做事有条理", score: 0 },
    { label: "B", text: "偶尔忘事，但不影响生活", score: 1 },
    { label: "C", text: "经常忘事，丢三落四明显变多", score: 2 },
    { label: "D", text: "刚发生的事转头就忘，反应也变慢了", score: 3 }
  ]},
  { category: "认知注意", text: "面对选择时，你的状态是？", options: [
    { label: "A", text: "能理性判断，做决定不纠结", score: 0 },
    { label: "B", text: "有时会犹豫，但最多几分钟", score: 1 },
    { label: "C", text: "很小的决定都要想很久，很消耗", score: 2 },
    { label: "D", text: "完全做不了决定，脑子像卡住一样", score: 3 }
  ]},
  { category: "社交自我", text: "你最近和朋友的联系是？", options: [
    { label: "A", text: "正常社交，能享受和人相处", score: 0 },
    { label: "B", text: "社交减少一点，但和亲近的人还有联系", score: 1 },
    { label: "C", text: "不太想见人，消息也常拖着不回", score: 2 },
    { label: "D", text: "完全不想社交，连最好的朋友也不想见", score: 3 }
  ]},
  { category: "社交自我", text: "你对自己的评价是？", options: [
    { label: "A", text: "整体接纳自己，有优点也有不足", score: 0 },
    { label: "B", text: "偶尔自我怀疑，但不过分", score: 1 },
    { label: "C", text: "经常自责，觉得自己不够好", score: 2 },
    { label: "D", text: "觉得自己一无是处，是别人的负担", score: 3 }
  ]},
  { category: "社交自我", text: "如果这种状态持续一个月，你会？", options: [
    { label: "A", text: "相信它自然会过去", score: 0 },
    { label: "B", text: "想调整一下生活作息", score: 1 },
    { label: "C", text: "有点担心，想找人聊聊", score: 2 },
    { label: "D", text: "害怕自己这样下去，觉得需要专业帮助", score: 3 }
  ]}
];

let currentQuestion = 0;
let totalScore = 0;
let dimensionScores = [0, 0, 0, 0]; // 情绪反应, 精力睡眠, 认知注意, 社交自我

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQuestion = 0;
  totalScore = 0;
  dimensionScores = [0, 0, 0, 0];
  showPage('page-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('quiz-step').textContent = `${String(currentQuestion + 1).padStart(2, '0')} / ${questions.length}`;
  document.getElementById('quiz-category').textContent = q.category;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;

  const container = document.getElementById('options-container');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `
      <div class="option-letter">${opt.label}</div>
      <div class="option-text">${opt.text}</div>
    `;
    div.onclick = () => selectOption(idx);
    container.appendChild(div);
  });
}

function selectOption(idx) {
  const q = questions[currentQuestion];
  const score = q.options[idx].score;
  totalScore += score;

  const dimMap = { "情绪反应": 0, "精力睡眠": 1, "认知注意": 2, "社交自我": 3 };
  dimensionScores[dimMap[q.category]] += score;

  currentQuestion++;
  if (currentQuestion < questions.length) {
    renderQuestion();
  } else {
    document.getElementById('progress-fill').style.width = '100%';
    showLoading();
  }
}

function getRadarPolygon(values, cx, cy, r) {
  // 4 个维度：上、右、下、左
  const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  return values.map((v, i) => {
    const radius = r * (v / 100);
    const x = cx + radius * Math.cos(angles[i]);
    const y = cy + radius * Math.sin(angles[i]);
    return `${x},${y}`;
  }).join(' ');
}
