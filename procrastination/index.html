<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>你为什么总是拖到最后一刻？</title>
  <meta name="description" content="12题拖延模式自测，识别你的拖延底层原因，并给出可执行的破局建议。">
  <style>
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --text: #2c2a28;
      --text-light: #6b6764;
      --primary: #b8824a;
      --primary-light: #f4e9d8;
      --accent: #6b8e7f;
      --accent-light: #e6efe9;
      --danger: #b5564a;
      --danger-light: #f6e4e0;
      --warning: #d4a04a;
      --warning-light: #faf0dc;
      --info: #5a7a9a;
      --info-light: #e6eef6;
      --radius: 20px;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 14px 40px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--bg);
    }

    .page {
      position: absolute;
      inset: 0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #page-result.active {
      position: relative;
      height: auto;
      min-height: 100vh;
      justify-content: flex-start;
      padding-top: 24px;
      padding-bottom: 40px;
      overflow: visible;
    }

    #page-result { position: absolute; overflow-y: auto; }

    /* Intro */
    .intro-visual {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 24px;
      position: relative;
      aspect-ratio: 1;
    }

    .clock-circle {
      position: absolute;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .clock-circle.main {
      width: 70%;
      height: 70%;
      background: var(--primary-light);
      color: var(--primary);
      top: 15%;
      left: 15%;
      z-index: 2;
      font-size: 48px;
    }

    .clock-circle.tag {
      width: 36%;
      height: 36%;
      background: white;
      color: var(--accent);
      font-size: 14px;
      padding: 8px;
      line-height: 1.3;
    }

    .clock-circle.tag.t1 { top: 2%; right: 0; }
    .clock-circle.tag.t2 { bottom: 8%; left: 0; }

    .title {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-light);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 18px rgba(184, 130, 74, 0.3);
    }

    .btn-primary:active { transform: scale(0.98); }

    .btn-outline {
      background: white;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      margin-top: 12px;
    }

    .btn-accent { background: var(--accent); color: white; box-shadow: 0 6px 18px rgba(107, 142, 127, 0.3); }
    .btn-danger { background: var(--danger); color: white; box-shadow: 0 6px 18px rgba(181, 86, 74, 0.3); }
    .btn-info { background: var(--info); color: white; box-shadow: 0 6px 18px rgba(90, 122, 154, 0.3); }
    .btn-warning { background: var(--warning); color: white; box-shadow: 0 6px 18px rgba(212, 160, 74, 0.3); }

    .tagline {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-light);
    }

    .tagline span {
      background: white;
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* Quiz */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.06);
      border-radius: 3px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .quiz-step { font-size: 13px; color: var(--text-light); font-weight: 600; }

    .quiz-category {
      font-size: 12px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .question {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 28px;
      min-height: 64px;
    }

    .option {
      background: var(--card);
      border: 1.5px solid transparent;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .option:hover { border-color: var(--primary); transform: translateY(-2px); }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .option-text { font-size: 15px; line-height: 1.5; color: var(--text); }

    /* Loading */
    .loading-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      position: relative;
    }

    .loading-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--primary);
      animation: spin 1s linear infinite;
    }

    .loading-ring:nth-child(2) { inset: 10px; border-top-color: var(--accent); animation: spin 1.4s linear infinite reverse; }
    .loading-ring:nth-child(3) { inset: 20px; border-top-color: var(--info); animation: spin 1.8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { text-align: center; font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .loading-sub { text-align: center; font-size: 14px; color: var(--text-light); }

    /* Result */
    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 20px;
    }

    .result-type {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .result-title { font-size: 24px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; }
    .result-desc { font-size: 15px; color: var(--text-light); line-height: 1.7; }

    .score-bar {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.06);
      border-radius: 6px;
      margin: 24px 0 8px;
      overflow: hidden;
      position: relative;
    }

    .score-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .score-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-light);
    }

    .radar-wrap {
      width: 100%;
      max-width: 260px;
      margin: 20px auto;
      aspect-ratio: 1;
      position: relative;
    }

    .radar-svg { width: 100%; height: 100%; }

    .section-title { font-size: 17px; font-weight: 700; margin: 24px 0 12px; }

    .tip-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .tip-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tip-content h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .tip-content p { font-size: 14px; color: var(--text-light); line-height: 1.6; }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .action-card .emoji { font-size: 28px; margin-bottom: 8px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .action-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .action-card p { font-size: 12px; color: var(--text-light); }

    .disclaimer {
      font-size: 12px;
      color: #999;
      line-height: 1.7;
      text-align: center;
      margin-top: 20px;
      padding: 0 8px;
    }

    .suggestion-box {
      background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
      text-align: center;
    }

    .suggestion-box h4 {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .suggestion-box p {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
    }

    .result-actions { margin-top: 8px; }
    .result-actions .btn { margin-bottom: 10px; }

    /* Type colors */
    .type-action .result-type, .type-action .result-title { color: var(--accent); }
    .type-action .score-fill { background: linear-gradient(90deg, var(--accent), #8fae9f); }
    .type-action .tip-icon { background: var(--accent-light); }

    .type-fear .result-type, .type-fear .result-title { color: var(--danger); }
    .type-fear .score-fill { background: linear-gradient(90deg, var(--danger), #d4786a); }
    .type-fear .tip-icon { background: var(--danger-light); }

    .type-perfect .result-type, .type-perfect .result-title { color: var(--warning); }
    .type-perfect .score-fill { background: linear-gradient(90deg, var(--warning), #e8b96a); }
    .type-perfect .tip-icon { background: var(--warning-light); }

    .type-energy .result-type, .type-energy .result-title { color: var(--info); }
    .type-energy .score-fill { background: linear-gradient(90deg, var(--info), #7a9ab8); }
    .type-energy .tip-icon { background: var(--info-light); }
  </style>
</head>
<body>
<div class="app">

  <!-- 开场页 -->
  <div class="page active" id="page-intro">
    <div class="intro-visual">
      <div class="clock-circle main">⏰</div>
      <div class="clock-circle tag t1">截止日<br>明天</div>
      <div class="clock-circle tag t2">再刷<br>5分钟</div>
    </div>

    <h1 class="title">你为什么<br>总是拖到最后一刻？</h1>
    <p class="subtitle">
      12 道题，从行动启动、完美主义、恐惧回避、能量管理 4 个维度，
      识别你拖延的真正底层原因，并给出能立刻用的破局方法。
    </p>

    <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>

    <div class="tagline">
      <span>12 题</span>
      <span>4 维度</span>
      <span>1 套行动方案</span>
    </div>
  </div>

  <!-- 答题页 -->
  <div class="page" id="page-quiz">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <div class="quiz-header">
      <span class="quiz-step" id="quiz-step">01 / 12</span>
      <span class="quiz-category" id="quiz-category">行动启动</span>
    </div>
    <div class="question" id="question-text"></div>
    <div id="options-container"></div>
  </div>

  <!-- 加载页 -->
  <div class="page" id="page-loading">
    <div class="loading-icon">
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
    </div>
    <div class="loading-text" id="loading-text">正在分析你的拖延模式…</div>
    <div class="loading-sub">行动启动 · 完美主义 · 恐惧回避 · 能量管理</div>
  </div>

  <!-- 结果页 -->
  <div class="page" id="page-result">
    <div id="result-container"></div>
  </div>

</div>

<script>
const questions = [
  { category: "行动启动", text: "面对一项重要任务，你的第一反应是？", options: [
    { label: "A", text: "立刻开始做", score: 0 },
    { label: "B", text: "先准备一下环境，再开始", score: 1 },
    { label: "C", text: "先做点别的轻松一下，等会儿再开始", score: 2 },
    { label: "D", text: "一想到要做就焦虑，反而刷起手机", score: 3 }
  ]},
  { category: "行动启动", text: "你开始一项任务通常需要？", options: [
    { label: "A", text: "几分钟内就能进入状态", score: 0 },
    { label: "B", text: "十几分钟热身", score: 1 },
    { label: "C", text: "拖到下午/晚上才动", score: 2 },
    { label: "D", text: "经常拖到截止前一晚才动", score: 3 }
  ]},
  { category: "行动启动", text: "当你对自己说'再做5分钟就开始'时，结果是？", options: [
    { label: "A", text: "真的5分钟后开始", score: 0 },
    { label: "B", text: "通常半小时内能开始", score: 1 },
    { label: "C", text: "经常拖到1小时以上", score: 2 },
    { label: "D", text: "能拖一下午甚至一整天", score: 3 }
  ]},
  { category: "完美主义", text: "你对'做得差不多就行'的态度是？", options: [
    { label: "A", text: "可以接受，先完成再完美", score: 0 },
    { label: "B", text: "有点别扭，但能说服自己", score: 1 },
    { label: "C", text: "很难接受，总想再改改", score: 2 },
    { label: "D", text: "完全做不到，要么做好要么不做", score: 3 }
  ]},
  { category: "完美主义", text: "你迟迟不开始一项任务，最常见的原因是？", options: [
    { label: "A", text: "单纯忘了或没排上", score: 0 },
    { label: "B", text: "觉得还没准备好", score: 1 },
    { label: "C", text: "怕做出来不够好被人评", score: 2 },
    { label: "D", text: "觉得必须状态最佳才能开始", score: 3 }
  ]},
  { category: "完美主义", text: "任务做到一半发现不够完美，你会？", options: [
    { label: "A", text: "继续推进，之后再调整", score: 0 },
    { label: "B", text: "稍微卡一下，但还是往下走", score: 1 },
    { label: "C", text: "反复修改这一处，进度卡住", score: 2 },
    { label: "D", text: "推翻重来，或者干脆放弃", score: 3 }
  ]},
  { category: "恐惧回避", text: "想到任务做不好可能的后果，你的感受是？", options: [
    { label: "A", text: "没什么，尽力就好", score: 0 },
    { label: "B", text: "有点压力，但不影响行动", score: 1 },
    { label: "C", text: "明显焦虑，会反复想", score: 2 },
    { label: "D", text: "恐惧到想逃，宁愿假装这事不存在", score: 3 }
  ]},
  { category: "恐惧回避", text: "面对不确定能不能做好的事，你会？", options: [
    { label: "A", text: "先试了再说", score: 0 },
    { label: "B", text: "评估一下风险再决定", score: 1 },
    { label: "C", text: "尽量推脱或让别人做", score: 2 },
    { label: "D", text: "直接回避，连试都不试", score: 3 }
  ]},
  { category: "恐惧回避", text: "当你拖延时，内心最常出现的声音是？", options: [
    { label: "A", text: "休息一下也没事", score: 0 },
    { label: "B", text: "等会儿就做", score: 1 },
    { label: "C", text: "万一做不好怎么办", score: 2 },
    { label: "D", text: "我就是不行，做了也没用", score: 3 }
  ]},
  { category: "能量管理", text: "你一天的精力分布大概是？", options: [
    { label: "A", text: "全天比较稳定", score: 0 },
    { label: "B", text: "上午好，下午犯困", score: 1 },
    { label: "C", text: "下午晚上才有状态", score: 2 },
    { label: "D", text: "整天都累，提不起劲", score: 3 }
  ]},
  { category: "能量管理", text: "你做'不想做但必须做'的事时，身体感受是？", options: [
    { label: "A", text: "没什么特别感受", score: 0 },
    { label: "B", text: "有点累但能撑", score: 1 },
    { label: "C", text: "明显疲惫，注意力涣散", score: 2 },
    { label: "D", text: "像被抽空，脑子完全转不动", score: 3 }
  ]},
  { category: "能量管理", text: "你一天能进入'深度专注'状态的时间大概是？", options: [
    { label: "A", text: "3 小时以上", score: 0 },
    { label: "B", text: "1-3 小时", score: 1 },
    { label: "C", text: "不到 1 小时", score: 2 },
    { label: "D", text: "几乎没有，一直被打断", score: 3 }
  ]}
];

let currentQuestion = 0;
let totalScore = 0;
let dimensionScores = [0, 0, 0, 0];

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQuestion = 0;
  totalScore = 0;
  dimensionScores = [0, 0, 0, 0];
  showPage('page-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('quiz-step').textContent = `${String(currentQuestion + 1).padStart(2, '0')} / ${questions.length}`;
  document.getElementById('quiz-category').textContent = q.category;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;

  const container = document.getElementById('options-container');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `
      <div class="option-letter">${opt.label}</div>
      <div class="option-text">${opt.text}</div>
    `;
    div.onclick = () => selectOption(idx);
    container.appendChild(div);
  });
}

function selectOption(idx) {
  const q = questions[currentQuestion];
  const score = q.options[idx].score;
  totalScore += score;

  const dimMap = { "行动启动": 0, "完美主义": 1, "恐惧回避": 2, "能量管理": 3 };
  dimensionScores[dimMap[q.category]] += score;

  currentQuestion++;
  if (currentQuestion < questions.length) {
    renderQuestion();
  } else {
    document.getElementById('progress-fill').style.width = '100%';
    showLoading();
  }
}

const loadingTexts = [
  "正在分析你的拖延模式…",
  "正在评估行动启动阈值…",
  "正在检测完美主义倾向…",
  "正在识别恐惧回避回路…",
  "正在生成你的破局方案…"
];

function showLoading() {
  showPage('page-loading');
  let i = 0;
  const el = document.getElementById('loading-text');
  el.textContent = loadingTexts[0];
  const interval = setInterval(() => {
    i++;
    if (i < loadingTexts.length) {
      el.textContent = loadingTexts[i];
    } else {
      clearInterval(interval);
      showResult();
    }
  }, 700);
}

function getResultType(score) {
  if (score <= 6) return 'action';
  if (score <= 14) return 'perfect';
  if (score <= 24) return 'fear';
  return 'energy';
}

const results = {
  action: {
    type: "行动派",

function getRadarPolygon(values, cx, cy, r) {
  const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  return values.map((v, i) => {
    const radius = r * (v / 100);
    const x = cx + radius * Math.cos(angles[i]);
    const y = cy + radius * Math.sin(angles[i]);
    return `${x},${y}`;
  }).join(' ');
}
