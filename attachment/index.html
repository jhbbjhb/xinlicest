<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>你在恋爱里是哪种依恋类型？</title>
  <meta name="description" content="12题依恋模式自测，识别你在亲密关系里的底层模式，并给出关系改善建议。">
  <style>
    :root {
      --bg: #fdf5f7;
      --card: #ffffff;
      --text: #2c282c;
      --text-light: #6b676c;
      --primary: #b56a8a;
      --primary-light: #f4e4ec;
      --accent: #8a6ab5;
      --accent-light: #ede4f4;
      --danger: #b5566a;
      --danger-light: #f6e0e6;
      --warning: #d48a4a;
      --warning-light: #faecd8;
      --info: #5a7a9a;
      --info-light: #e6eef6;
      --radius: 20px;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 14px 40px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--bg);
    }

    .page {
      position: absolute;
      inset: 0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #page-result.active {
      position: relative;
      height: auto;
      min-height: 100vh;
      justify-content: flex-start;
      padding-top: 24px;
      padding-bottom: 40px;
      overflow: visible;
    }

    #page-result { position: absolute; overflow-y: auto; }

    /* Intro */
    .intro-visual {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 24px;
      position: relative;
      height: 200px;
    }

    .heart-shape {
      position: absolute;
      font-size: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart-shape.h1 { top: 20px; left: 50%; transform: translateX(-50%); }
    .heart-shape.h2 { top: 90px; left: 30px; font-size: 40px; opacity: 0.6; }
    .heart-shape.h3 { top: 90px; right: 30px; font-size: 40px; opacity: 0.6; }
    .heart-shape.h4 { top: 140px; left: 50%; transform: translateX(-50%); font-size: 32px; opacity: 0.4; }

    .title {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-light);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 18px rgba(181, 106, 138, 0.3);
    }

    .btn-primary:active { transform: scale(0.98); }

    .btn-outline {
      background: white;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      margin-top: 12px;
    }

    .btn-accent { background: var(--accent); color: white; box-shadow: 0 6px 18px rgba(138, 106, 181, 0.3); }
    .btn-danger { background: var(--danger); color: white; box-shadow: 0 6px 18px rgba(181, 86, 106, 0.3); }
    .btn-info { background: var(--info); color: white; box-shadow: 0 6px 18px rgba(90, 122, 154, 0.3); }
    .btn-warning { background: var(--warning); color: white; box-shadow: 0 6px 18px rgba(212, 138, 74, 0.3); }

    .tagline {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-light);
    }

    .tagline span {
      background: white;
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* Quiz */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(0,0,0,0.06);
      border-radius: 3px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .quiz-step { font-size: 13px; color: var(--text-light); font-weight: 600; }

    .quiz-category {
      font-size: 12px;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .question {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 28px;
      min-height: 64px;
    }

    .option {
      background: var(--card);
      border: 1.5px solid transparent;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .option:hover { border-color: var(--primary); transform: translateY(-2px); }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .option-text { font-size: 15px; line-height: 1.5; color: var(--text); }

    /* Loading */
    .loading-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      position: relative;
    }

    .loading-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--primary);
      animation: spin 1s linear infinite;
    }

    .loading-ring:nth-child(2) { inset: 10px; border-top-color: var(--accent); animation: spin 1.4s linear infinite reverse; }
    .loading-ring:nth-child(3) { inset: 20px; border-top-color: var(--info); animation: spin 1.8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { text-align: center; font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .loading-sub { text-align: center; font-size: 14px; color: var(--text-light); }

    /* Result */
    .result-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 20px;
    }

    .result-type {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .result-title { font-size: 24px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; }
    .result-desc { font-size: 15px; color: var(--text-light); line-height: 1.7; }

    .score-bar {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.06);
      border-radius: 6px;
      margin: 24px 0 8px;
      overflow: hidden;
      position: relative;
    }

    .score-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .score-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-light);
    }

    .radar-wrap {
      width: 100%;
      max-width: 260px;
      margin: 20px auto;
      aspect-ratio: 1;
      position: relative;
    }

    .radar-svg { width: 100%; height: 100%; }

    .section-title { font-size: 17px; font-weight: 700; margin: 24px 0 12px; }

    .tip-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .tip-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tip-content h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .tip-content p { font-size: 14px; color: var(--text-light); line-height: 1.6; }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .action-card .emoji { font-size: 28px; margin-bottom: 8px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .action-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .action-card p { font-size: 12px; color: var(--text-light); }

    .disclaimer {
      font-size: 12px;
      color: #999;
      line-height: 1.7;
      text-align: center;
      margin-top: 20px;
      padding: 0 8px;
    }

    .suggestion-box {
      background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
      text-align: center;
    }

    .suggestion-box h4 {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .suggestion-box p {
      font-size: 14px;
      color: var(--text);
      line-height: 1.7;
    }

    .result-actions { margin-top: 8px; }
    .result-actions .btn { margin-bottom: 10px; }

    /* Type colors */
    .type-secure .result-type, .type-secure .result-title { color: var(--accent); }
    .type-secure .score-fill { background: linear-gradient(90deg, var(--accent), #a88ac8); }
    .type-secure .tip-icon { background: var(--accent-light); }

    .type-anxious .result-type, .type-anxious .result-title { color: var(--danger); }
    .type-anxious .score-fill { background: linear-gradient(90deg, var(--danger), #d47a8e); }
    .type-anxious .tip-icon { background: var(--danger-light); }

    .type-avoidant .result-type, .type-avoidant .result-title { color: var(--info); }
    .type-avoidant .score-fill { background: linear-gradient(90deg, var(--info), #7a9ab8); }
    .type-avoidant .tip-icon { background: var(--info-light); }

    .type-fearful .result-type, .type-fearful .result-title { color: var(--warning); }
    .type-fearful .score-fill { background: linear-gradient(90deg, var(--warning), #e8a86a); }
    .type-fearful .tip-icon { background: var(--warning-light); }
  </style>
</head>
<body>
<div class="app">

  <!-- 开场页 -->
  <div class="page active" id="page-intro">
    <div class="intro-visual">
      <div class="heart-shape h1">💕</div>
      <div class="heart-shape h2">💗</div>
      <div class="heart-shape h3">💙</div>
      <div class="heart-shape h4">🤍</div>
    </div>

    <h1 class="title">你在恋爱里<br>是哪种依恋类型？</h1>
    <p class="subtitle">
      12 道题，从亲密需求、冲突反应、独立空间、自我认知 4 个维度，
      识别你在亲密关系里的底层模式，并给出关系改善的具体方向。
    </p>

    <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>

    <div class="tagline">
      <span>12 题</span>
      <span>4 维度</span>
      <span>1 份关系指南</span>
    </div>
  </div>

  <!-- 答题页 -->
  <div class="page" id="page-quiz">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>
    <div class="quiz-header">
      <span class="quiz-step" id="quiz-step">01 / 12</span>
      <span class="quiz-category" id="quiz-category">亲密需求</span>
    </div>
    <div class="question" id="question-text"></div>
    <div id="options-container"></div>
  </div>

  <!-- 加载页 -->
  <div class="page" id="page-loading">
    <div class="loading-icon">
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
      <div class="loading-ring"></div>
    </div>
    <div class="loading-text" id="loading-text">正在分析你的依恋模式…</div>
    <div class="loading-sub">亲密需求 · 冲突反应 · 独立空间 · 自我认知</div>
  </div>

  <!-- 结果页 -->
  <div class="page" id="page-result">
    <div id="result-container"></div>
  </div>

</div>

<script>
const questions = [
  { category: "亲密需求", text: "当你喜欢一个人时，你的状态是？", options: [
    { label: "A", text: "能自然表达，也享受对方的回应", score: 0 },
    { label: "B", text: "很想靠近，但总担心对方不够喜欢我", score: 1 },
    { label: "C", text: "喜欢但保持距离，怕靠太近会失控", score: 2 },
    { label: "D", text: "又想靠近又想逃，整个人很撕裂", score: 3 }
  ]},
  { category: "亲密需求", text: "对方多久回你消息，会让你开始不安？", options: [
    { label: "A", text: "多久都行，每个人都有自己的节奏", score: 0 },
    { label: "B", text: "几小时内不回就会开始想多", score: 1 },
    { label: "C", text: "不太在意，反而希望对方别太频繁", score: 2 },
    { label: "D", text: "既希望秒回，又觉得秒回压力很大", score: 3 }
  ]},
  { category: "亲密需求", text: "你需要对方表达爱意的方式是？", options: [
    { label: "A", text: "偶尔表达就好，行动比言语重要", score: 0 },
    { label: "B", text: "需要经常确认，否则会怀疑", score: 1 },
    { label: "C", text: "不太需要，过多表达反而别扭", score: 2 },
    { label: "D", text: "想要但又害怕，收到会紧张", score: 3 }
  ]},
  { category: "冲突反应", text: "和另一半吵架后，你的第一反应是？", options: [
    { label: "A", text: "冷静后主动沟通解决", score: 0 },
    { label: "B", text: "焦虑地等对方先来找自己", score: 1 },
    { label: "C", text: "躲开，需要一个人待很久", score: 2 },
    { label: "D", text: "想和好又想拉黑，反复横跳", score: 3 }
  ]},
  { category: "冲突反应", text: "对方说'我们需要谈谈'，你的感受是？", options: [
    { label: "A", text: "有点紧张但能面对", score: 0 },
    { label: "B", text: "非常慌，担心是不是要分手", score: 1 },
    { label: "C", text: "烦躁，本能想回避", score: 2 },
    { label: "D", text: "心跳加速，同时想逃跑", score: 3 }
  ]},
  { category: "冲突反应", text: "关系出现问题时，你倾向于？", options: [
    { label: "A", text: "直接表达感受，一起想办法", score: 0 },
    { label: "B", text: "反复试探对方到底还在不在乎", score: 1 },
    { label: "C", text: "默默疏远，等关系自然冷淡", score: 2 },
    { label: "D", text: "一边试探一边疏远，自己都矛盾", score: 3 }
  ]},
  { category: "独立空间", text: "另一半想天天见面，你的感受是？", options: [
    { label: "A", text: "很开心，但也保留自己的事", score: 0 },
    { label: "B", text: "很享受，恨不得 24 小时在一起", score: 1 },
    { label: "C", text: "有点窒息，需要自己的空间", score: 2 },
    { label: "D", text: "想答应又本能抗拒", score: 3 }
  ]},
  { category: "独立空间", text: "你有自己的兴趣爱好和社交圈吗？", options: [
    { label: "A", text: "有，恋爱只是生活的一部分", score: 0 },
    { label: "B", text: "有，但恋爱后会慢慢让位", score: 1 },
    { label: "C", text: "有，而且很保护不被打扰", score: 2 },
    { label: "D", text: "有时很投入，有时完全想独处", score: 3 }
  ]},
  { category: "独立空间", text: "对方想了解你所有朋友和行踪，你？", options: [
    { label: "A", text: "可以分享，但也希望有隐私", score: 0 },
    { label: "B", text: "很开心，觉得是被在乎", score: 1 },
    { label: "C", text: "反感，感觉被监视", score: 2 },
    { label: "D", text: "表面配合内心抗拒", score: 3 }
  ]},
  { category: "自我认知", text: "恋爱中你对自己的评价是？", options: [
    { label: "A", text: "整体认可自己，值得被爱", score: 0 },
    { label: "B", text: "总觉得不够好，怕配不上对方", score: 1 },
    { label: "C", text: "觉得自己独立，不太需要依赖", score: 2 },
    { label: "D", text: "时而自信时而自卑，波动很大", score: 3 }
  ]},
  { category: "自我认知", text: "对方对你太好时，你的感受是？", options: [
    { label: "A", text: "开心，自然接受并回馈", score: 0 },
    { label: "B", text: "感动但不安，担心哪天会失去", score: 1 },
    { label: "C", text: "不自在，有压力", score: 2 },
    { label: "D", text: "既渴望又想推开", score: 3 }
  ]},
  { category: "自我认知", text: "回忆你的恋爱模式，你觉得？", options: [
    { label: "A", text: "整体健康，能亲密也能独立", score: 0 },
    { label: "B", text: "总是爱得很累，患得患失", score: 1 },
    { label: "C", text: "习惯保持距离，难以真正亲密", score: 2 },
    { label: "D", text: "爱得很纠结，靠近又逃跑", score: 3 }
  ]}
];

let currentQuestion = 0;
let totalScore = 0;
let dimensionScores = [0, 0, 0, 0];

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQuestion = 0;
  totalScore = 0;
  dimensionScores = [0, 0, 0, 0];
  showPage('page-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('quiz-step').textContent = `${String(currentQuestion + 1).padStart(2, '0')} / ${questions.length}`;
  document.getElementById('quiz-category').textContent = q.category;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;

  const container = document.getElementById('options-container');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `
      <div class="option-letter">${opt.label}</div>
      <div class="option-text">${opt.text}</div>
    `;
    div.onclick = () => selectOption(idx);
    container.appendChild(div);
  });
}

function selectOption(idx) {
  const q = questions[currentQuestion];
  const score = q.options[idx].score;
  totalScore += score;

  const dimMap = { "亲密需求": 0, "冲突反应": 1, "独立空间": 2, "自我认知": 3 };
  dimensionScores[dimMap[q.category]] += score;

  currentQuestion++;
  if (currentQuestion < questions.length) {
    renderQuestion();
  } else {
    document.getElementById('progress-fill').style.width = '100%';
    showLoading();
  }
}

const loadingTexts = [
  "正在分析你的依恋模式…",
  "正在评估亲密需求强度…",
  "正在检测冲突应对方式…",
  "正在识别独立空间偏好…",
  "正在生成你的关系指南…"
];

function showLoading() {
  showPage('page-loading');
  let i = 0;
  const el = document.getElementById('loading-text');
  el.textContent = loadingTexts[0];
  const interval = setInterval(() => {
    i++;
    if (i < loadingTexts.length) {
      el.textContent = loadingTexts[i];
    } else {
      clearInterval(interval);
      showResult();
    }
  }, 700);
}

function getResultType(score) {
  if (score <= 6) return 'secure';
  if (score <= 14) return 'anxious';
  if (score <= 24) return 'avoidant';
  return 'fearful';
}

const results = {
  secure: {

function getRadarPolygon(values, cx, cy, r) {
  const angles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  return values.map((v, i) => {
    const radius = r * (v / 100);
    const x = cx + radius * Math.cos(angles[i]);
    const y = cy + radius * Math.sin(angles[i]);
    return `${x},${y}`;
  }).join(' ');
}
